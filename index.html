<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Wants to Be a Math Champion?</title>
<style>
:root{--gold:#f6c343;--gold2:#b8801a;--org:#f97316;--grn:#16a34a;--red:#dc2626;--txt:#f6f2e7;--footer-h:clamp(20px,3.2vh,30px);
--rim:linear-gradient(#ffe9a8,#e0a526 45%,#8f5f0c);
--face:linear-gradient(#2a2491,#0d0a4d);
--hexo:polygon(4vh 0,calc(100% - 4vh) 0,100% 50%,calc(100% - 4vh) 100%,4vh 100%,0 50%);
--hexi:polygon(3.7vh 0,calc(100% - 3.7vh) 0,100% 50%,calc(100% - 3.7vh) 100%,3.7vh 100%,0 50%)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;font-family:"Segoe UI","Trebuchet MS",Verdana,sans-serif;color:var(--txt);background:radial-gradient(ellipse 75% 60% at 50% 40%,#3a34b8 0,#1d1873 40%,#0b0840 75%,#04031c 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 42%,#ffffff12 0 4deg,transparent 4deg 9deg);-webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0,transparent 75%);mask-image:radial-gradient(circle at 50% 42%,#000 0,transparent 75%)}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:1.2vh;color:#fff;background:#2a2391;padding:1vh 1.8vh;font-weight:700;font-size:2vh}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:.4vh solid #fff;outline-offset:.2vh}
#ft{position:fixed;left:0;right:0;bottom:0;height:var(--footer-h);display:flex;align-items:center;justify-content:center;font-size:1.7vh;color:#fffc;background:#000b;z-index:50;white-space:nowrap;overflow:hidden;padding:0 1vh}
#app{position:relative;z-index:1;height:calc(100% - var(--footer-h));height:calc(100dvh - var(--footer-h));display:flex;flex-direction:column;gap:1vh;padding:1vh 1.2vw}

/* gold-rimmed hexagon plates (the look of the answer boxes) */
.plate{background:var(--rim);padding:.4vh;clip-path:var(--hexo)}
.pin{clip-path:var(--hexi);background:var(--face)}

/* setup */
.setup{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.setcard{width:min(94vw,118vh)}
.setcard .pin{display:flex;flex-direction:column;align-items:center;gap:1vh;padding:3vh 9vh}
.title{font-size:5.2vh;font-weight:900;text-align:center;line-height:1.1;background:linear-gradient(#fff3c4,#f6c343 50%,#c98a12);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 .3vh 0 #000a)}
.sub{font-size:2.4vh;color:#d9d4ff;text-align:center}
.lbl{font-size:2.6vh;font-weight:800;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:1.2vh;justify-content:center}
input{background:#0b0840;color:#fff;font-size:3vh;padding:1.2vh 1.6vh;border-radius:1.2vh;border:.4vh solid var(--gold);width:min(40vh,80vw);text-align:center}
input::placeholder{color:#8f8ac8}
.opt{background:#2a2391;border:.3vh solid #f6c34388;font-size:2.2vh}
.opt.on{background:linear-gradient(#ffe08a,#e0a526);color:#2a1800;border-color:#fff}
.big{background:linear-gradient(#ffe08a,#e0a526);color:#2a1800;font-size:3.2vh;padding:1.2vh 6vh;border-radius:5vh;font-weight:800;box-shadow:0 .5vh 0 #8f5f0c}
.big:disabled{box-shadow:none}
.cc{width:100%;display:flex;flex-direction:column;align-items:center;gap:1vh}
.cc .stu{font-size:2vh;padding:.7vh 1.4vh;background:#2a2391;border:.3vh solid #f6c34355}
.cc .stu.on{background:linear-gradient(#ffe08a,#e0a526);color:#2a1800;border-color:#fff}
.cc .stu.dn{opacity:.4;text-decoration:line-through}
.cc .tm{font-size:2vh;font-weight:800;color:#d9d4ff;margin-top:.4vh}
.cc .scr{max-height:23vh;overflow:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:.6vh}
.cc input{font-size:2.4vh;width:min(26vh,50vw)}
.cc .ok{color:#8dffb0;font-weight:800;font-size:2.1vh}
.err{color:#ff9a9a;font-weight:800;min-height:3vh;font-size:2.3vh}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:1vh;align-items:center;background:linear-gradient(#0d0a4a,#070530);border:.3vh solid #f6c34366;border-radius:1.6vh;padding:.8vh 1.2vh}
.who{display:flex;flex-direction:column;line-height:1.1;padding:0 1.4vh;min-width:9vh}
.who small{font-size:1.5vh;color:#b9b4ff}
.who b{font-size:3vh;color:var(--gold);max-width:26vh;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.tb{background:#ffffff1f;font-size:1.7vh;padding:.8vh 1.4vh}
.tmr{width:6.2vh;height:6.2vh;border-radius:50%;border:.4vh solid var(--gold);background:#0b0840;display:flex;align-items:center;justify-content:center}
.tmr b{font-size:3vh;color:#fff}
.tmr.low{border-color:#ff5252;animation:beat .5s infinite}
.tmr.low b{color:#ff8a8a}
.lfs{display:flex;gap:1.2vh}
.lf{position:relative;width:9.6vh;height:5.4vh;padding:0;border-radius:50%;background:radial-gradient(ellipse at 50% 25%,#4a43c9,#150f5e);border:.35vh solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.9vh;font-weight:900}
.lf svg{width:3.4vh;height:3.4vh;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lf:hover:not(:disabled){background:radial-gradient(ellipse at 50% 25%,#6a63e8,#2a2391)}
.lf:disabled{opacity:.5}
.lf.x:disabled{opacity:.7}
.lf.x::before,.lf.x::after{content:"";position:absolute;left:50%;top:50%;width:78%;height:.5vh;background:var(--red);border-radius:1vh}
.lf.x::before{transform:translate(-50%,-50%) rotate(28deg)}
.lf.x::after{transform:translate(-50%,-50%) rotate(-28deg)}

/* question area */
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 21vw;gap:1.2vh}
.qp{display:flex;flex-direction:column;gap:1.2vh;min-height:0;padding:.4vh 0}
.meta{display:flex;flex-wrap:wrap;gap:1vh;justify-content:center}
.chip{font-size:1.9vh;font-weight:700;color:#d9d4ff;background:#0b0840cc;border:.25vh solid #f6c34355;border-radius:3vh;padding:.3vh 1.6vh}
.chip.hot{background:linear-gradient(#ffe08a,#e0a526);color:#2a1800;border-color:#fff}
.tmr b.inf{font-size:4.2vh}
.rwd{background:linear-gradient(#ffe08a,#e0a526);color:#2a1800;border-radius:2.4vh;padding:1.6vh 4vh;display:flex;flex-direction:column;gap:.4vh;align-items:center;max-width:92%}
.rwd small{font-size:1.8vh;font-weight:800;letter-spacing:.3vh}
.rwd b{font-size:4.4vh;font-weight:900;line-height:1.1}
.rwd span{font-size:2.5vh;font-weight:700}
.chart{height:18vh;display:flex;justify-content:center}
.chart svg{height:100%;max-width:100%}
.qplate .pin{display:flex;align-items:center;justify-content:center;min-height:13vh;padding:1.6vh 6.5vh}
.qt{font-size:3.7vh;font-weight:700;line-height:1.25;text-align:center}
.qt.long{font-size:3.1vh}
.opts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.4vh 2.4vh}
.opt-b{display:flex;min-height:0;padding:.4vh;border-radius:0;background:var(--rim);clip-path:var(--hexo);color:var(--txt);text-align:left;font-size:3.2vh;font-weight:700}
.opt-b .in{flex:1;display:flex;align-items:center;gap:1.4vh;padding:0 5vh;clip-path:var(--hexi);background:var(--face);overflow-wrap:anywhere;line-height:1.15}
.opt-b.sm{font-size:2.6vh}
.ltr{color:var(--org);font-weight:900}
.opt-b:hover:not(:disabled) .in{background:linear-gradient(#3a34b8,#1a1570)}
.opt-b:focus-visible{outline:none}
.opt-b:focus-visible .in{box-shadow:inset 0 0 0 .5vh #fff}
.opt-b.sel .in{background:linear-gradient(#ffb347,#f97316);color:#1a0b00}
.opt-b.sel .ltr{color:#1a0b00}
.opt-b.ok .in{background:linear-gradient(#3fdc78,#128a3c);color:#04200e}
.opt-b.ok .ltr{color:#04200e}
.opt-b.ok{animation:blink .5s 4}
.opt-b.no .in{background:linear-gradient(#ef4444,#991b1b)}
.opt-b.no .ltr{color:#fff}
.opt-b:disabled{opacity:1;cursor:default}
.opt-b.dim{opacity:.5}
.opt-b.off{visibility:hidden}
.exp{min-height:5.5vh;font-size:2.3vh;font-weight:600;text-align:center;color:#e6e2ff}
.act{display:flex;justify-content:center;gap:1.4vh}
.act .big{font-size:3vh;padding:1vh 6vh}

/* points ladder */
.lad{display:flex;flex-direction:column;gap:.5vh;background:linear-gradient(#0d0a4a,#070530);border:.3vh solid #f6c34366;border-radius:1.6vh;padding:1vh;min-height:0}
.lt{font-size:2vh;font-weight:800;color:var(--gold);text-align:center}
.rung{flex:1;min-height:0;display:flex;align-items:center;gap:1vh;padding:0 1.4vh;border-radius:3vh;font-size:2.1vh;font-weight:700;color:#f4a53a}
.rung i{font-style:normal;width:3vh;text-align:right}
.rung span{flex:1;font-size:1.7vh;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rung.ms{color:#fff;font-weight:800}
.rung.dn{opacity:.5}
.rung.on{background:linear-gradient(#ffb347,#f97316);color:#1a0b00;opacity:1}

/* overlays */
.ov{position:fixed;inset:0 0 var(--footer-h) 0;background:#000c;display:flex;align-items:center;justify-content:center;padding:1.5vh;z-index:10}
.ov.top2{z-index:30;background:#000a}
.box{background:linear-gradient(#1a1580,#0a0740);border:.5vh solid var(--gold);border-radius:3vh;padding:2.2vh;width:min(96vw,1150px);max-height:calc(100dvh - var(--footer-h) - 2vh);overflow-y:auto;scrollbar-width:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.4vh}
.q2{font-size:3.4vh;font-weight:700}
.ans{font-size:5vh;color:var(--gold);font-weight:900}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh;text-align:left;width:100%}
.rg>div{background:#0006;border-radius:1.6vh;padding:1.2vh 1.4vh;font-size:1.85vh;line-height:1.35}
.rg h3{margin:0 0 .5vh;color:var(--gold);font-size:2.5vh}
.ok2{background:#16a34a;font-size:3.2vh}.no2{background:#334155;font-size:3.2vh}
.rk{font-size:3vh;font-weight:800}
.cf{position:fixed;top:-6vh;width:1.6vh;height:2.6vh;animation:fall 3.2s linear forwards;z-index:40;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@keyframes blink{50%{filter:brightness(1.5)}}
@keyframes beat{50%{transform:scale(1.12)}}
@media (max-aspect-ratio:1/1){
.main{grid-template-columns:1fr}.lad{display:none}
.opts{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr)}
.rg{grid-template-columns:1fr}
.setcard .pin{padding:4.4vh 6vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>
const $=s=>document.querySelector(s),app=$('#app');
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[r(0,a.length-1)],f=n=>n.toLocaleString('en-US');
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),M5=()=>r(0,11)*5;
const cmf=x=>[Math.floor(x/100)?Math.floor(x/100)+' m':'',x%100?x%100+' cm':''].filter(Boolean).join(' ')||'0 cm';
const t24=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60),dur=d=>Math.floor(d/60)+' hr '+d%60+' min';
// ---------- question builders ----------
// mk builds one question: the correct answer plus 3 different wrong answers (never negative, never a copy of the answer)
function mk(cat,q,a,wr,e,ch){a=String(a);wr=[...new Set(wr.map(String))].filter(x=>x!==a&&!x.startsWith('-'));while(wr.length<3){const c=String(r(2,99)*7);if(c!==a&&!wr.includes(c))wr.push(c)}const o=shuf([a,...wr.slice(0,3)]);return{cat,q,o,a:o.indexOf(a),e,ch}}
const GS=[
[['Which angle measures exactly 90 degrees?','Right angle',['Acute angle','Obtuse angle','Straight angle'],'A right angle is exactly 90 degrees, like the corner of a book.'],
['Which angle is smaller than 90 degrees?','Acute angle',['Right angle','Obtuse angle','Straight angle'],'An acute angle is smaller than 90 degrees.'],
['How many right angles does a square have?','4',['2','3','6'],'Every corner of a square is a right angle, so it has 4.'],
['Which solid has 6 square faces?','Cube',['Cone','Cylinder','Sphere'],'A cube has 6 equal square faces.']],
[['Which angle is greater than 90 degrees but less than 180 degrees?','Obtuse angle',['Acute angle','Right angle','Straight angle'],'An obtuse angle is between 90 and 180 degrees.'],
['A straight angle measures how many degrees?','180 degrees',['90 degrees','360 degrees','45 degrees'],'A straight line makes a 180 degree angle.'],
['How many faces does a cuboid have?','6',['4','8','12'],'A cuboid has 6 rectangular faces.'],
['How many corners (vertices) does a cube have?','8',['4','6','12'],'A cube has 8 corners.']],
[['Which of these is an acute angle?','65 degrees',['90 degrees','120 degrees','180 degrees'],'Acute angles are smaller than 90 degrees.'],
['How many edges does a cube have?','12',['6','8','10'],'A cube has 12 edges.'],
['A full turn is how many degrees?','360 degrees',['180 degrees','90 degrees','270 degrees'],'One complete turn is 360 degrees.'],
['Which of these is an obtuse angle?','135 degrees',['45 degrees','90 degrees','180 degrees'],'Obtuse angles are between 90 and 180 degrees.']],
[['Looking straight down at the top of a cube, which shape do you see?','Square',['Triangle','Circle','Pentagon'],'The top face of a cube is a square.'],
['Which solid has one curved surface and one flat circular face?','Cone',['Cylinder','Sphere','Cube'],'A cone has a curved surface and one circular base.'],
['How many flat faces does a cylinder have?','2',['1','3','0'],'A cylinder has a flat circle at the top and bottom.'],
['A cube is viewed from the front, the side and the top. How do the views compare?','All three views are squares',['All three views are circles','All three views are triangles','Each view is a different shape'],'Every face of a cube is a square.']],
[['What is the greatest number of faces of a cube you can see at once?','3',['6','4','2'],'From one corner you can see 3 faces at most.'],
['A half turn plus a quarter turn makes how many degrees?','270 degrees',['180 degrees','90 degrees','360 degrees'],'180 + 90 = 270 degrees.'],
['Which of these is a reflex angle?','250 degrees',['90 degrees','150 degrees','180 degrees'],'A reflex angle is more than 180 degrees.'],
['A cuboid is 4 cm long, 3 cm wide and 2 cm high. How many of its faces are squares?','0',['2','4','6'],'All sides are different, so every face is a rectangle, not a square.']]];
const G=l=>()=>{const x=pick(GS[l]);return mk('Geometry',x[0],x[1],x[2],x[3])};
const N=['ones','tens','hundreds','thousands','ten thousands'];
const OLD=[
[G(0),
// place value: the chosen digit appears only ONCE in the number, so the question has exactly one answer
()=>{let n,p,d;do{n=r(10000,99999);p=r(0,4);d=+String(n)[4-p]}while(d==0||String(n).split(String(d)).length!=2);
const v=d*10**p,all=[0,1,2,3,4].filter(k=>k!=p).map(k=>d*10**k),w=p>0?[d,...shuf(all.filter(x=>x!=d)).slice(0,2)]:shuf(all).slice(0,3);
return mk('Numbers',`What is the place value of ${d} in ${f(n)}?`,f(v),w.map(f),`The digit ${d} is in the ${N[p]} place, so its place value is ${f(v)}.`)},
// expanded form: at least 3 non-zero digits so there are always 3 sensible wrong answers
()=>{let n,P;do{n=r(10000,99999);P=[];String(n).split('').forEach((c,i)=>{if(c!='0')P.push(+c*10**(4-i))})}while(P.length<3);
const J=a=>a.map(f).join(' + '),V=[];P.forEach((x,i)=>{const up=[...P];up[i]=x*10;V.push(J(up));if(x>=10){const dn=[...P];dn[i]=x/10;V.push(J(dn))}});
return mk('Numbers',`Which is the expanded form of ${f(n)}?`,J(P),shuf(V).slice(0,3),'Split the number by place value: '+J(P)+'.')},
()=>{const s=r(1,20),d=pick([2,3,4,5,6,7,8,9,10,25]),a=[0,1,2,3].map(i=>s+i*d),n=s+4*d;return mk('Patterns',`What comes next?  ${a.join(', ')}, __`,n,[n+d,n+1,n-1,n+2,n-2,n+2*d],`The pattern adds ${d} each time, so ${a[3]} + ${d} = ${n}.`)},
()=>{const a=r(2,9),b=r(1,19)*50;return mk('Measurements',`Convert ${a} km ${b} m into metres.`,f(a*1000+b),[f(a*100+b),f(a*10000+b),f(a*1000+b*10),f(a+b),f(a*1000+b/10)],`1 km = 1,000 m, so ${a} km = ${f(a*1000)} m. Add ${b} m.`)},
()=>{const h=r(2,9);return mk('Time',`How many minutes are in ${h} hours?`,h*60,[h*100,h*30,h*24,h*12,h*60+60],`1 hour = 60 minutes, so ${h} x 60 = ${h*60}.`)},
()=>{const n=r(6,23);return mk('Information Processing','How many does this tally chart show?',n,[n+1,n-1,n+5,n-5,n+2],'Each group of 5 shows 5. Count the groups, then add the extra lines.',{t:'tally',n})}],
[G(1),
()=>{const d=shuf([1,2,3,4,5,6,7,8,9]).slice(0,5),U=new Set();while(U.size<4)U.add(+shuf(d).join(''));const a=[...U],g=Math.random()<.5,ans=g?Math.max(...a):Math.min(...a);return mk('Numbers',`Which is the ${g?'greatest':'smallest'} number?`,f(ans),a.filter(x=>x!=ans).map(f),'Compare the digits from the left, starting with the ten thousands.')},
()=>{const a=r(100,999),b=r(100,999),s=a+b;return mk('Numbers',`Calculate ${a} + ${b}.`,f(s),[s+10,s-10,s+100,s-100,s+1].map(f),'Add the ones, tens and hundreds, carrying when needed.')},
()=>{const s=r(2,20),d=pick([3,4,5,6,7,8,9,10]),t=[0,1,2,3,4].map(i=>s+i*d),m=t[2];return mk('Patterns',`Find the missing number: ${t[0]}, ${t[1]}, __, ${t[3]}, ${t[4]}`,m,[m+1,m-1,m+2,m-2,m+d-1,m-d+1],`The pattern adds ${d} each time: ${t[1]} + ${d} = ${m}.`)},
()=>{const a=r(1,6),b=r(2,18)*5,c=r(1,5),d=r(2,18)*5,t=a*100+b+c*100+d;return mk('Measurements',`Find ${a} m ${b} cm + ${c} m ${d} cm.`,cmf(t),[cmf(t+10),cmf(t-10),cmf(t+100),cmf(t-100),(a+c)+' m '+(b+d)+' cm'],'Add the centimetres first. 100 cm = 1 m, so regroup if needed.')},
()=>{const h=r(13,23),m=M5(),H=h-12,w=x=>((x+11)%12)+1;return mk('Time',`A train leaves at ${pad(h)}:${pad(m)}. What is this in normal 12-hour time?`,`${H}:${pad(m)} PM`,[`${H}:${pad(m)} AM`,`${w(H+2)}:${pad(m)} PM`,`${w(H-2)}:${pad(m)} PM`,`${w(H+1)}:${pad(m)} PM`,`${w(H+11)}:${pad(m)} AM`],'Subtract 12 from the hour for times after 12:00. It is PM.')},
()=>{const T=['A','B','C','D'],v=shuf([...Array(40).keys()].map(x=>x+6)).slice(0,4),hi=v.indexOf(Math.max(...v));return mk('Information Processing','The bar graph shows books read by four teams. Which team read the most books?','Team '+T[hi],T.filter((_,i)=>i!=hi).map(x=>'Team '+x),`The tallest bar is the highest: Team ${T[hi]} with ${v[hi]}.`,{t:'bar',l:T.map(x=>'Team '+x),v})}],
[G(2),
// clock angle: the reflex angle (360 - angle) is removed from the wrong answers so it can never be a second correct answer
()=>{const h=r(2,6),a=h*30;return mk('Geometry',`What is the angle between the clock hands at ${h} o'clock?`,a+' degrees',[a+30,a-30,a+60,a+90,a-60].filter(x=>x>0&&x!=360-a).map(x=>x+' degrees'),`Each hour on a clock is 30 degrees. ${h} x 30 = ${a} degrees.`)},
()=>{const a=r(1000,6999),b=r(1000,6999),s=a+b;return mk('Numbers',`Calculate ${f(a)} + ${f(b)}.`,f(s),[s+10,s-10,s+100,s-100,s+1000,s-1000].map(f),'Add place by place from the ones, carrying when needed.')},

let t=ok?'Correct! +'+ptsOf(S.qi)+' points. ':(timedOut?'Time is up. ':'Not this time. ')+'The answer is '+'ABCD'[q.a]+': '+q.o[q.a]+'. ';t+=q.e;
if(!ok)t+='  Game over.';S.out=!ok;if(ok&&(S.qi+1)%3==0){P.badges.push(LV[l].n);t+='  BADGE UNLOCKED: '+LV[l].n+' Badge!'+(S.qi<14?' A new reward awaits you!':'');setTimeout(()=>fx('badge'),900)}
$('#exp').textContent=t;$('#act').innerHTML=`<button class="big" onclick="nextQ()">${S.out||S.qi==14?'See results':(S.qi+1)%3==0?'Claim reward':'Next question'}</button>`}
function nextQ(){if(S.out||S.qi>=14)return endRun();if((S.qi+1)%3==0)return unlock();S.qi++;newQ(lvOf(S.qi))}
// shown after every completed level: the badge plus the reward that was just unlocked
function unlock(){const l=lvOf(S.qi),x=rew(l),nl=l+1;grant(l);fx('badge');cf(40);const P=S.P,nx=LV[nl];
modal(`<div class="title" style="font-size:4.4vh">Level ${l+1} complete!</div><div class="rk">${LV[l].n} Badge earned</div>
<div class="rwd"><small>REWARD UNLOCKED</small><b>${x.t}</b><span>${x.d}</span></div>
<div class="q2" style="font-size:2.7vh">Next: Level ${nl+1} - ${nx.n}<br>${ptsOf(S.qi+1)} points per question${S.timerOn?' | '+(P.inf===nl?'Unlimited time':(nx.t+P.time)+' seconds each'):''}<br>Questions get harder. Good luck, ${esc(P.name)}!</div>
<button class="big" style="font-size:3vh;padding:1.2vh 5vh" onclick="closeM();S.qi++;newQ(lvOf(S.qi))">Start Level ${nl+1}</button>`)}
// ---------- lifelines ----------
function lifeInfo(k){if(S.locked)return;fx('life');S.paused=true;const o=document.createElement('div');o.className='ov top2';o.id='li';
o.innerHTML=`<div class="box"><div class="ans">${LIFE[k][0]}</div><div class="q2">${LIFE[k][1]}</div><div class="row"><button class="ok2" onclick="useLife('${k}')">Use it now</button><button class="no2" onclick="$('#li').remove();S.paused=false">Cancel</button></div></div>`;document.body.appendChild(o)}
function useLife(k){$('#li').remove();const P=S.P,q=S.q;P.life[k]=1;S.paused=false;$('#lfs').innerHTML=lifeHTML();
if(k=='flip'){newQ(lvOf(S.qi));return}
if(k=='fifty'){shuf([0,1,2,3].filter(i=>i!=q.a)).slice(0,2).forEach(i=>{$('#o'+i).classList.add('off');if(S.sel==i){S.sel=-1;$('#lockb').disabled=true}})}
if(k=='ask'){S.paused=true;let s=30;const o=document.createElement('div');o.className='ov top2';o.id='ak';o.innerHTML=`<div class="box"><div class="ans">Ask a Friend</div><div class="q2">Talk together: <b id="as">30</b> seconds</div><button class="ok2" onclick="clearInterval(S.ai);$('#ak').remove();S.paused=false">Done</button></div>`;document.body.appendChild(o);
S.ai=setInterval(()=>{s--;const e=$('#as');if(!e){clearInterval(S.ai);return}e.textContent=s;if(s<=0){clearInterval(S.ai);fx('whistle')}},1000)}}
// ---------- results ----------
function endRun(){clearInterval(iv);const P=S.P,all=!S.out&&P.correct==15;logRun(P);if(all)fx('fan');
modal(`${all?`<svg viewBox="0 0 120 120" style="height:16vh"><path d="M30 10h60v28c0 20-13 34-30 34S30 58 30 38z" fill="#ffd24a" stroke="#e5a91b" stroke-width="3"/><path d="M30 18H12c0 20 8 30 22 32M90 18h18c0 20-8 30-22 32" fill="none" stroke="#e5a91b" stroke-width="6" stroke-linecap="round"/><rect x="52" y="70" width="16" height="22" fill="#e5a91b"/><rect x="36" y="92" width="48" height="14" rx="4" fill="#ffd24a" stroke="#e5a91b" stroke-width="3"/></svg><div class="title" style="font-size:4.6vh">Math Champion</div>`:`<div class="title" style="font-size:4.6vh">Game over</div>`}
<div class="ans">${esc(P.name)}</div><div class="q2">${P.score} / ${maxPts()} points | ${P.correct} / 15 correct</div><div class="rk">${P.badges.length?'Badges: '+P.badges.join(', '):'No badge this time'}</div>
<div class="q2" style="font-size:2.6vh">${all?'The future belongs to curious minds!':'Every mistake is a chance to learn. Try again!'}</div>
${CC.mode=='auto'&&CC.pool.length?`<div class="row"><button class="big" onclick="callNext()">Next player</button><button class="no2" onclick="closeM();begin()">Play again</button><button class="no2" onclick="setup()">Back to setup</button></div>`:`<div class="row"><button class="big" onclick="closeM();begin()">Play again</button><button class="no2" onclick="setup()">New game</button></div>`}`);if(all)cf(70)}
function newGame(){fx('click');if(S.P&&!S.locked)S.paused=true;modal(`<div class="ans">Start a new game?</div><div class="q2">Your current score will be lost.</div><div class="row"><button class="ok2" onclick="setup()">Yes, new game</button><button class="no2" onclick="back()">Cancel</button></div>`)}
function cf(n){const C=['#f6c343','#f97316','#3b82f6','#fff','#22c55e'];for(let i=0;i<n;i++){const d=document.createElement('span');d.className='cf';d.style.cssText=`left:${r(0,98)}vw;background:${pick(C)};animation-delay:${Math.random()*1.6}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}}
function modal(h){closeM();const o=document.createElement('div');o.className='ov';o.id='mod';o.innerHTML=`<div class="box">${h}</div>`;document.body.appendChild(o)}
function closeM(){const o=$('#mod');if(o)o.remove()}
setup();if(CC.code)loadCode(CC.code);
</script></body></html>
